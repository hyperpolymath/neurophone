version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # `open-pull-requests-limit: 0` suppresses routine version-update PRs
    # while leaving Dependabot SECURITY PRs flowing. The previous
    # `ignore: "*" patch` rule also silenced security PRs under GitHub\'s
    # current Dependabot behaviour. See rsr-template-repo commit 78b050e
    # and 007-lang/audits/audit-dependabot-automation-gap-2026-04-17.md.
    open-pull-requests-limit: 10
    # rand 0.9 and rand_distr 0.5 are pinned: ndarray-rand 0.16 requires rand ^0.9.
    # Do NOT bump these until ndarray-rand releases a version supporting rand 0.10+.
    # See PR #129 and PLAYBOOK.a2ml (dependency-management section).
    ignore:
      - dependency-name: "rand"
        versions: [">=0.10"]
      - dependency-name: "rand_distr"
        versions: [">=0.6"]
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"