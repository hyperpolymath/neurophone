# SPDX-License-Identifier: MPL-2.0
# Rust CI — thin wrapper calling the shared estate reusable in
# hyperpolymath/standards. Configure once, propagate everywhere.
# See: docs/CI-REUSABLE-WORKFLOWS.adoc in standards.
#
# Ref: tracks @main (matching governance.yml). The previous SHA pin
# (cc5a372) was stale — the estate's rust-ci-reusable moved, so the run
# failed at startup with 0 jobs. Re-pin to a verified SHA once standards
# publishes one (estate propagation should automate this).
name: Rust CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  rust-ci:
    uses: hyperpolymath/standards/.github/workflows/rust-ci-reusable.yml@main
    with:
      enable_audit: true
      enable_coverage: true
