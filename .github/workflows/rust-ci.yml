# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Rust CI — thin wrapper calling the shared estate reusable in
# hyperpolymath/standards. Configure once, propagate everywhere.
# See: docs/CI-REUSABLE-WORKFLOWS.adoc in standards.
name: Rust CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  rust-ci:
    uses: hyperpolymath/standards/.github/workflows/rust-ci-reusable.yml@fcb8669169b4e9f5d9848608df880ae5fae812b4 # re-pinned 2026-07-01: toolchain-required-input fix (standards#439)
    with:
      enable_audit: true
      enable_coverage: true
