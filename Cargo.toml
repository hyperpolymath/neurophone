[workspace]
resolver = "2"
members = [
    "crates/lsm",
    "crates/esn",
    "crates/bridge",
    "crates/sensors",
    "crates/llm",
    "crates/claude-client",
    "crates/neurophone-core",
    "crates/neurophone-android",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MPL-2.0"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
repository = "https://github.com/hyperpolymath/neurophone"

[workspace.dependencies]
# Core neural network
ndarray = { version = "0.17", features = ["rayon", "serde"] }
ndarray-rand = "0.16"
# rand pinned to 0.9 / rand_distr 0.5 to match ndarray-rand 0.16 (which bundles
# rand 0.9). A dependabot bump to rand 0.10 broke the build: rand 0.10 is a
# separate, incompatible rand in the tree (Distribution/Rng traits don't match
# ndarray-rand's). Revert until ndarray-rand ships a rand-0.10-compatible release.
rand = "0.9"
rand_distr = "0.5"
rayon = "1.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Async runtime
tokio = { version = "1.52", features = ["full"] }
futures = "0.3"

# HTTP client (for Claude API)
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Android JNI
jni = "0.22"

# Configuration
config = "0.14"
toml = "0.8"

# Testing
approx = "0.5"
proptest = "1.4"
criterion = { version = "0.8", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release-android]
inherits = "release"
opt-level = "s"
lto = "thin"
