<!DOCTYPE html>
<!--
  SPDX-License-Identifier: MPL-2.0

  Gossamer webview entry for the NeuroSymbolic Phone UI.
  Loads the AffineScript UI compiled to Deno-ESM (dist/ui.mjs).

  This markup is the structural equivalent of the old Android view tree in
  res/layout/activity_main.xml; element ids match those queried by ui.affine.

  TODO(#83 rebase): the Gossamer host is expected to serve this file as the
    webview's root document and to inject the `gossamer` host bridge object
    before module scripts run. Confirm the asset URL scheme used by #3.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'" />
  <title>NeuroSymbolic Phone</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>NeuroSymbolic Phone</h1>
    <p class="subtitle">LSM + ESN + Llama 3.2 + Claude</p>
  </header>

  <section class="status-row">
    <span class="label">Status:</span>
    <span id="statusText" class="status-value">Initializing...</span>
    <button id="startButton" class="btn-small">Start</button>
  </section>

  <h2 class="section-title">Neural Context:</h2>
  <div id="neuralContextText" class="neural-context" aria-live="polite">[No neural state available]</div>

  <h2 class="section-title">Query:</h2>
  <textarea id="inputField" rows="2" placeholder="Enter your question..." disabled></textarea>

  <div class="query-row">
    <label class="switch-label">
      <input type="checkbox" id="localSwitch" checked />
      Prefer Local
    </label>
    <span class="spacer"></span>
    <span id="activityIndicator" class="spinner" hidden></span>
    <button id="sendButton" disabled>Send</button>
  </div>

  <h2 class="section-title">Response:</h2>
  <div id="responseText" class="response" aria-live="polite">Response will appear here...</div>

  <footer>Sensors → LSM → Bridge → LLM ↔ ESN → Output</footer>

  <!--
    dist/ui.mjs is produced by build.sh (AffineScript → Deno-ESM). A committed
    stub (dist/ui.mjs) keeps the webview functional / inspectable before the
    AffineScript toolchain is wired in CI. TODO(#83): replace stub with real
    compiled output.
  -->
  <script type="module" src="dist/ui.mjs"></script>
</body>
</html>
