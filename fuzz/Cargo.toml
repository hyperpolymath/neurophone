# cargo-fuzz crate. The repo root is a *virtual* workspace (no [package]),
# so this crate must declare its own empty [workspace] table; otherwise
# `cargo build --manifest-path fuzz/Cargo.toml` (what ClusterFuzzLite runs)
# fails with "current package believes it's in a workspace when it's not".
[workspace]

[package]
name = "neurophone-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"

[[bin]]
name = "fuzz_main"
path = "fuzz_targets/fuzz_main.rs"
test = false
doc = false
