\* TLC configuration for the neurophone lifecycle safety proof (obligation 2.1,
\* issue #84). Checks the two safety invariants and the terminal-shutdown
\* temporal property against the Lifecycle spec. WorkBound keeps the otherwise
\* unbounded `work` counter finite for exhaustive model checking.
SPECIFICATION Spec
CONSTRAINT WorkBound
INVARIANT TypeOK
INVARIANT NoUseBeforeInit
PROPERTY NoUseAfterShutdown
\* "down" is intentionally terminal (shutdown consumes the system), so a state
\* with no successor is the modelled end-of-life, not a livelock/deadlock bug.
CHECK_DEADLOCK FALSE
